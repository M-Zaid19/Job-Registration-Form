<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<style>
    .form{
        text-align: center;
        margin-top: 3%;
    }
    h1{
        font-family: Arial, Helvetica, sans-serif;
        color: aquamarine;
        font-size: 55px

    }
    body{
        background-color: cadetblue;
    }
    input{
        padding: 20px 55px;
        color: white;
        background-color: rgb(4, 78, 121);
        border: 2px solid black;
        font-weight: bold;
        margin-top: 1%;
        font-size: 36px;
        border-radius: 10px;
    }
    h2{
        font-size: 32px;
        color: black;
        font-family: arial;
        margin-top: 4%;
}
button{
    padding: 20px 30px ;
    background-color: aqua;
    color:rgba(2, 27, 14, 0.588);
    border-radius: 10px;
    margin-top: 3%;
    border: 3px solid rgb(8, 109, 197);
    font-size: 30px;
    font-weight: bold;
}
h3{
    font-family: Arial, Helvetica, sans-serif;
    font-size: 30px;
    border: 4px solid blue;
    font-weight: bold;
    width: 600px;
    text-align: center;
    align-items: center;
    margin-left: 35%;
    margin-top: 3%;
}
</style>
</head>
<body>
    <div class="form">
    <form>
<h1>Job Registration Form </h1>
<input type="text" id="name" placeholder="Enter Your Name"> <br>
<input type="Email" id="email" placeholder="Enter Your Email"> <br>
<input type="address" id="address" placeholder="Enter Your House Address"> <br>
<input type="number" id="number" placeholder="Enter Your Phone Number"> <br>
</form>
<button id="button" type="button">Save</button>
<h3 id="action"></h3>
<h2 id="result"></h2>
</div>

<script src="jQuery/script"></script>
<script>
    $("#button").click(function(){
var name = $("#name").val();
var email = $("#email").val();
var address = $("#address").val();
var number = $("#number").val();
if(name == "" | email == ""| address == "" | number == ""){
$("#action").text(" ❌❌❌ Please Fill All Fields ").addClass("text-danger")
return;
}
if(!email.includes("@")){
    $("#action").text("Please Enter a Valid Email").addClass("text-danger")
    return;
}
if(number.length !== 11){
    $("#action").text(" Please enter a Valid Phone number ").addClass("text-danger")
    return;
}
else{
   $("#action").text(" Login Successfully ✅✅ ").removeClass("text-danger").addClass("text-success")
 
}
$("#result").html(
    " Name : " + name + "<br>" +
    " Email : " + email + "<br>" +
    " Address : " + address + "<br>" +
    " Number : " + number 

);

});
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
